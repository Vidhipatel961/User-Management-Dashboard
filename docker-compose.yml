version: "3.9"

services:
  backend:
    build:
      context: ./UserManagementAPI
    ports:
      - "5072:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5072/api
    depends_on:
      - backend
